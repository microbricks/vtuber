<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn VTuber Kanaal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="avatar.png" alt="VTuber Avatar" class="avatar">
        <h1>Nick VTube</h1>
        <p>Streamer • Gamer • Chaos Expert</p>
    </header>

    <main>
        <section>
            <h2>Over Mij</h2>
            <p>
                Hallo! Ik ben Nick, een Nederlandse VTuber die games speelt,
                livestreams doet en veel te hard lacht om slechte grappen.
            </p>
        </section>

        <section>
            <h2>Links</h2>
            <div class="links">
                <a href="https://youtube.com" target="_blank">YouTube</a>
                <a href="https://twitch.tv" target="_blank">Twitch</a>
                <a href="https://x.com" target="_blank">X</a>
                <a href="https://discord.com" target="_blank">Discord</a>
            </div>
        </section>

        <section>
            <h2>Live Status</h2>
            <p id="status">Offline</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
